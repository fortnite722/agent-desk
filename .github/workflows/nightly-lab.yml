name: nightly pattern lab
on:
  schedule:
    - cron: "15 1 * * 2-6"   # after the close, Tue-Sat UTC = Mon-Fri evening in the US
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lab
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data
          key: qqq-1min-${{ github.run_id }}
          restore-keys: qqq-1min-
      - name: Run the lab on real QQQ data
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python pattern_lab.py --source alpaca --days 500 --controls 24
      - name: Backtest the strategy desks on real history
        if: always()
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python cloud/research.py
      - name: Save results
        if: always()
        run: bash cloud/sync.sh "nightly lab"
